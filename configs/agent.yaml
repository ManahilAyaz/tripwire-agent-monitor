# Kashmala's agent config (T13/T14 read these; nothing is hard-coded in src/).
# model: CLAUDE.md fixes the agent as Llama-3.1-8B-Instruct, but `llama-3.1-8b-instant` returned
# 404 model_not_found on testing (2026-11-22) and a live /v1/models check showed NO Llama model
# available to this Groq key at all. Tried openai/gpt-oss-20b next — it has BUILT-IN tools
# (browser_search/code_interpreter per Groq's docs) that fire even with no tools declared,
# causing intermittent 400s ("Tool choice is none, but model called a tool"). Switched to
# qwen/qwen3.8-27b, which doesn't carry that behavior — confirmed, not just assumed: Manahil's
# merged T01 script uses the same model independently, and her T03 schema doc
# (docs/log_schema.md, PR #5) uses it in the summary-line example too.
#
# Superseded for actual pilot collection (2026-11-24): Groq's free-tier daily token quota
# (200K) is too small for a 30-50 episode batch regardless of model - see
# configs/agent_ollama.yaml, which runs Llama 3.1 8B locally via Ollama instead (no Groq, no
# daily quota). This file is kept for single-episode sanity checks and for Manahil's T01
# script/T03 schema doc, which still reference Qwen specifically.
model: "qwen/qwen3.8-27b"
temperature: 0.0
max_tokens: 300
max_steps: 30

# T13: retry/backoff on Groq 429/5xx
max_retries: 5
backoff_base_seconds: 1.0
backoff_max_seconds: 30.0

# qwen/qwen3.8-27b's free-tier org limit is 200K tokens/day (console.groq.com/dashboard/limits,
# checked 2026-11-24) — without a bound, resending the full growing episode history every step
# let 2 full 30-step episodes exhaust the whole day's budget on their own. This caps the prompt
# to the system message + initial observation + the last N step-exchanges.
history_window_steps: 10

# T14: if this many episodes in a row come back "error" (even after their one in-run retry),
# stop the batch early instead of burning the rest of --n the same way — a streak this long
# means something systemic (e.g. quota exhaustion), not one flaky episode.
max_consecutive_errors: 3
