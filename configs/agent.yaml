# Kashmala's agent config (T13/T14 read these; nothing is hard-coded in src/).
# model: CLAUDE.md fixes the agent as Llama-3.1-8B-Instruct, but `llama-3.1-8b-instant` returned
# 404 model_not_found on testing (2026-11-22) and a live /v1/models check showed NO Llama model
# available to this Groq key at all. Tried openai/gpt-oss-20b next — it has BUILT-IN tools
# (browser_search/code_interpreter per Groq's docs) that fire even with no tools declared,
# causing intermittent 400s ("Tool choice is none, but model called a tool"). Using
# qwen/qwen3.8-27b instead, which doesn't carry that behavior. NOT YET CONFIRMED with Manahil —
# this changes a documented project assumption, raise it with her/the team before treating it
# as final.
model: "qwen/qwen3.8-27b"
temperature: 0.0
max_steps: 30

# T13: retry/backoff on Groq 429/5xx
max_retries: 5
backoff_base_seconds: 1.0
backoff_max_seconds: 30.0
